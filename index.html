<style>
/* ===================================================
   GIAO DIỆN PREMIUM TOXIC CYBER-PLANT (ALL-IN-ONE)
   =================================================== */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

body {
    margin: 0;
    font-family: 'Rajdhani', sans-serif;
    /* Nền không gian chuyển động ma mị, pha trộn giữa tím đen và xanh lá độc dược */
    background: linear-gradient(-45deg, #09021a, #0c1f13, #1c0a35, #040914);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    color: #fff;
    text-align: center;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 20px;
    box-sizing: border-box;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Khung kính cường lực viền Neon Độc Dược */
.glass-container {
    background: rgba(10, 5, 25, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 2px solid rgba(34, 197, 94, 0.35); /* Đường viền xanh lá độc phát sáng */
    padding: 35px 25px;
    border-radius: 32px;
    box-shadow: 0 0 40px rgba(34, 197, 94, 0.25), inset 0 0 25px rgba(147, 51, 234, 0.2);
    max-width: 430px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
}

/* Tiêu đề Neon phát sáng rực rỡ */
.neon-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 10px rgba(34, 197, 94, 0.6), 0 0 25px rgba(34, 197, 94, 0.9);
    animation: neonPulse 2s ease-in-out infinite alternate;
    margin-top: 0;
    margin-bottom: 25px;
}

@keyframes neonPulse {
    0% { text-shadow: 0 0 8px rgba(34, 197, 94, 0.5), 0 0 20px rgba(34, 197, 94, 0.8); transform: scale(0.99); }
    100% { text-shadow: 0 0 15px rgba(34, 197, 94, 0.9), 0 0 30px rgba(168, 85, 247, 0.9); transform: scale(1.01); }
}

/* Vành đai mạ vàng hoàng gia tích hợp hệ thống đèn LED định vị hạt giống */
.wheel-outer-ring {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 15px auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffe066, #f5b041, #fcf6ba, #b38728, #fbf5b7, #9a7d0a);
    box-shadow: 0 0 35px rgba(245, 176, 65, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* Hệ thống bóng LED nhấp nháy liên tục quanh vòng vàng */
.wheel-outer-ring::before {
    content: '';
    position: absolute;
    top: 6px; left: 6px; right: 6px; bottom: 6px;
    border-radius: 50%;
    border: 5px dotted #ffffff;
    box-shadow: 0 0 12px #ffffff;
    animation: ledBlink 0.6s infinite alternate;
    pointer-events: none;
    z-index: 5;
}

@keyframes ledBlink {
    0% { filter: drop-shadow(0 0 2px #fff) brightness(1); opacity: 0.5; }
    100% { filter: drop-shadow(0 0 10px #22c55e) brightness(1.8); opacity: 1; }
}

/* Kim chỉ hướng "Mũi Tên Vàng" đặt chuẩn xác tại đỉnh 12h */
.needle {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 36px;
    background: linear-gradient(to bottom, #ffffff, #f5b041, #b38728);
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
    z-index: 110;
}

/* Đĩa xoay 8 phân vùng màu Tím Cyber và Xanh Độc Dược đan xen sắc nét */
.spin-box {
    width: 288px;
    height: 288px;
    border-radius: 50%;
    background: conic-gradient(
        #6b21a8 0deg 45deg, 
        #14532d 45deg 90deg, 
        #6b21a8 90deg 135deg, 
        #14532d 135deg 180deg, 
        #6b21a8 180deg 225deg, 
        #14532d 225deg 270deg, 
        #6b21a8 270deg 315deg, 
        #14532d 315deg 360deg
    );
    box-shadow: inset 0 0 35px rgba(0,0,0,0.9);
    position: relative;
    overflow: hidden;
    transition: transform 4.5s cubic-bezier(0.15, 0.88, 0.3, 1);
    z-index: 10;
}

/* Căn chỉnh chữ và icon vật phẩm chạy dọc tâm múi quay */
.tg-item {
    position: absolute;
    width: 80px;
    height: 144px; /* Đúng bằng bán kính đĩa */
    top: 0;
    left: calc(50% - 40px);
    transform-origin: bottom center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 18px;
    box-sizing: border-box;
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 2px 5px rgba(0,0,0,0.9);
}

.tg-item i {
    font-size: 26px;
    margin-bottom: 4px;
    font-style: normal;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
}

/* KHÓA CHẶT TÂM LÕI ĐỘT BIẾN (NÚT BẤM TRUNG TÂM) */
.center-hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    background: radial-gradient(circle, #ffffff 0%, #22c55e 55%, #14532d 100%);
    border-radius: 50%;
    box-shadow: 0 6px 22px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.7);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 3px solid #4ade80;
    transition: transform 0.2s;
}

.center-hub:hover {
    transform: translate(-50%, -50%) scale(1.05);
}

.spin-text {
    font-size: 11px;
    font-weight: 900;
    color: #040914;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    text-align: center;
    line-height: 1.1;
}

/* THANH NẠP NĂNG LƯỢNG ĐỘC DƯỢC (PLANT FURY BAR) */
.bar {
    width: 100%;
    height: 14px;
    background: #050b14;
    margin: 25px 0 5px 0;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(34, 197, 94, 0.4);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.7);
    position: relative;
    box-sizing: border-box;
}

.bar-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #4ade80, #10b981);
    box-shadow: 0 0 15px #22c55e;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
}

/* Hiệu ứng dòng chảy quét xéo liên tục qua thanh năng lượng */
.bar-inner::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: liquidScan 1.2s infinite linear;
}

@keyframes liquidScan {
    0% { left: -100%; }
    100% { left: 150%; }
}

/* ===================================================
   HỆ THỐNG POPUP MODAL HOÀNG GIA (DYNAMICS BOUNCE)
   =================================================== */
.modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(4, 2, 10, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    z-index: 99999;
    transition: opacity 0.4s ease;
}

.modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
}

.modal-content {
    background: radial-gradient(circle at top, #2e1065, #080314);
    border: 2px solid #f5b041;
    padding: 40px 30px;
    border-radius: 28px;
    width: 90%;
    max-width: 370px;
    text-align: center;
    box-shadow: 0 0 50px rgba(245, 176, 65, 0.4), inset 0 0 30px rgba(0,0,0,0.8);
    position: relative;
    overflow: hidden;
    transform: scale(0.4) translateY(60px);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1.25); /* Elastic Bounce nảy đàn hồi cực cuốn */
}

.modal-overlay.show .modal-content {
    transform: scale(1) translateY(0);
}

/* Quét tia sáng hoàng kim qua bảng kết quả */
.modal-shine {
    position: absolute;
    top: 0; left: -150%;
    width: 120%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transform: skewX(-30deg);
    animation: shineSweep 3s infinite ease-in-out;
}

@keyframes shineSweep {
    0% { left: -150%; }
    40% { left: 150%; }
    100% { left: 150%; }
}

/* Icon Máy Slot dập dình 3D */
.modal-icon {
    font-size: 65px;
    margin-bottom: 12px;
    animation: floatIcon 2s ease-in-out infinite alternate;
}

@keyframes floatIcon {
    0% { transform: translateY(0) scale(1) rotate(-3deg); }
    100% { transform: translateY(-10px) scale(1.05) rotate(3deg); filter: drop-shadow(0 10px 20px rgba(245,176,65,0.4)); }
}

.popup-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 25px;
    font-weight: 900;
    margin: 0 0 15px 0;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
}

.modal-text {
    font-size: 17px;
    color: #cbd5e1;
    margin-bottom: 25px;
    line-height: 1.5;
}

/* Văn bản hiển thị số Xu Vàng phóng đại nhấp nháy kích thích thị giác */
.gold-text {
    color: #f5b041;
    font-weight: 900;
    font-size: 28px;
    display: block;
    margin-top: 6px;
    text-shadow: 0 0 15px rgba(245, 176, 65, 0.7);
    animation: textGlow 1.2s ease-in-out infinite alternate;
}

@keyframes textGlow {
    0% { transform: scale(0.97); }
    100% { transform: scale(1.04); text-shadow: 0 0 25px rgba(245, 176, 65, 1); }
}

/* NÚT THÔI MIÊN "ĐI THÔI" CO GIÃN LIÊN TỤC (PREMIUM PULSING) */
.modal-cta-btn {
    padding: 15px 0;
    width: 100%;
    background: linear-gradient(135deg, #ffe066, #f5b041);
    color: #0c051c;
    font-family: 'Orbitron', sans-serif;
    font-size: 19px;
    font-weight: 900;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(245, 176, 65, 0.4);
    border: none;
    transition: all 0.2s ease;
    animation: buttonPulse 1.3s infinite;
}

.modal-cta-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 10px 30px rgba(245, 176, 65, 0.7);
}

@keyframes buttonPulse {
    0% { box-shadow: 0 6px 20px rgba(245, 176, 65, 0.4); transform: scale(1); }
    50% { box-shadow: 0 10px 35px rgba(245, 176, 65, 0.7); transform: scale(1.03); }
    100% { box-shadow: 0 6px 20px rgba(245, 176, 65, 0.4); transform: scale(1); }
}

/* HIỆU ỨNG PHÁO HOA GIẤY BÙNG NỔ */
.confetti {
    position: fixed;
    z-index: 100000;
    pointer-events: none;
    animation: explodeBurst 2s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
}

@keyframes explodeBurst {
    0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(0) rotate(var(--r)); opacity: 0; }
}
</style>
</head>

<body>

<div class="glass-container">
    <h2 class="neon-title">🎯 THẢ GAI DIỆT ZOMBIE - GIẬT JACKPOT KHỦNG</h2>

    <div class="wheel-outer-ring">
        <div class="needle"></div>
        
        <div id="spin" class="spin-box">
            <div class="tg-item" style="transform: rotate(22.5deg);"><i>🍈</i>MUTANT</div>
            <div class="tg-item" style="transform: rotate(67.5deg);"><i>🧟</i>CRUSH</div>
            <div class="tg-item" style="transform: rotate(112.5deg);"><i>₿</i>BTC</div>
            <div class="tg-item" style="transform: rotate(157.5deg);"><i>💎</i>JACKPOT</div>
            <div class="tg-item" style="transform: rotate(202.5deg);"><i>🎁</i>BONUS</div>
            <div class="tg-item" style="transform: rotate(247.5deg);"><i>🔥</i>MEGA</div>
            <div class="tg-item" style="transform: rotate(292.5deg);"><i>🧪</i>TOXIC</div>
            <div class="tg-item" style="transform: rotate(337.5deg);"><i>👑</i>VIP</div>
        </div>

        <div class="center-hub" onclick="startSpin()">
            <div class="spin-text">QUAY<br>NGAY</div>
        </div>
    </div>

    <div class="bar">
        <div id="bar" class="bar-inner"></div>
    </div>
</div>

<div id="popupModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-shine"></div>
        <div class="modal-icon">🎰</div>
        <h3 class="popup-title">Chúc Mừng Bạn!</h3>
        <p id="modal-text" class="modal-text"></p>
        <div class="modal-cta-btn" onclick="goLink()">👉 VÀO GAME </div>
    </div>
</div>

<script>
var targetURL = "";
var spinning = false;

function startSpin(){
    if(spinning) return; 
    spinning = true;

    // Trigger sự kiện bắt đầu quay cho Tiktok Pixel
    ttq.track('SpinStart');

    let spin = document.getElementById("spin");
    let bar = document.getElementById("bar");
    
    // Gia tốc quay tối thiểu 6 vòng (2160 độ) kết hợp góc ngẫu nhiên siêu mượt
    let randomDeg = 2160 + Math.floor(Math.random() * 360);
    spin.style.transform = `rotate(${randomDeg}deg)`;

    let progress = 0;
    let duration = 4500; // Thời gian quay 4.5 giây khớp với hiệu ứng đĩa
    let intervalTime = 30; 
    let step = (100 / (duration / intervalTime));

    let interval = setInterval(() => {
        progress += step;
        if(progress >= 100) progress = 100;
        bar.style.width = progress + "%";

        if(progress >= 100){
            clearInterval(interval);
            setTimeout(showResult, 500); // Đợi đĩa quay dừng hẳn rồi hiển thị popup
        }
    }, intervalTime);
}

function showResult(){
    let modal = document.getElementById("popupModal");
    let modalText = document.getElementById("modal-text");

    // Tạo số điểm/xu thưởng ngẫu nhiên từ 100 đến 500
    let coins = Math.floor(Math.random() * 400 + 100);
    modalText.innerHTML = `Quả cầu gai đã nghiền nát Zombie! Hệ thống ghi nhận bạn nhận được <span class="gold-text">${coins} ĐIỂM ĐỘT BIẾN</span>`;
    
    modal.classList.add("show");
    
    // Trigger sự kiện kết quả cho Tiktok Pixel
    ttq.track('SpinResult', {coins: coins});
    launchConfetti();
}

function launchConfetti(){
    for(let i = 0; i < 140; i++){ 
        let c = document.createElement("div");
        c.className = "confetti";
        
        c.style.left = "50%";
        c.style.top = "50%";
        
        let size = Math.random() * 12 + 6;
        c.style.width = size + "px";
        c.style.height = size + "px";
        
        c.style.borderRadius = Math.random() > 0.3 ? "50%" : "2px";
        // Bắn pháo giấy hệ màu Neon phát sáng
        c.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
        
        let angle = Math.random() * Math.PI * 2;
        let velocity = Math.random() * 500 + 250; 
        let xMove = Math.cos(angle) * velocity;
        let yMove = Math.sin(angle) * velocity + 150; 
        let rotation = Math.random() * 1440 - 720;

        c.style.setProperty('--x', `${xMove}px`);
        c.style.setProperty('--y', `${yMove}px`);
        c.style.setProperty('--r', `${rotation}deg`);
        
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2000);
    }
}

function goLink(){
    ttq.track('ClickButton');
    window.location.href = targetURL;
}
</script>

</body>
